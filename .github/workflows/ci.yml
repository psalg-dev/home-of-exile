name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  frontend-lint:
    name: Frontend — lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  backend-lint:
    name: Backend — lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check app/

      - name: Ruff lint (scripts)
        run: uv run ruff check ../scripts/

      - name: Mypy type-check
        run: uv run mypy app/

      - name: Run tests
        run: uv run pytest tests/ -v
