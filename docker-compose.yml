services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    depends_on:
      - db
    environment:
      - REPOE_DATA_DIR=/data/repoe
      # LuaJIT / PathOfBuilding engine settings
      - POB_SRC_DIR=/pob/src
      - LUAJIT_CMD=luajit
      - LUAJIT_POOL_SIZE=2

  db:
    image: postgres:17-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hoe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoe}
      POSTGRES_DB: ${POSTGRES_DB:-hoe}
    ports:
      - "5432:5432"

volumes:
  pgdata:
